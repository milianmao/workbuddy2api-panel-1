services:
  wb2api:
    image: ghcr.io/milianmao/workbuddy2api-panel-1:sha-8e3b47c
    container_name: workbuddy2api
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - TZ=Asia/Shanghai
      - WB2A_LISTEN=0.0.0.0:7863
    ports:
      - "8788:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json
